name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: psxbootinspect.exe
            history: ps2history.exe
          - os: ubuntu-latest
            name: linux-x64
            bin: psxbootinspect
            history: ps2history
          - os: macos-latest
            name: macos-arm64
            bin: psxbootinspect
            history: ps2history
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      # The crate's tests use synthetic inputs only; the oracle tests skip without a BIOS.
      - run: cargo test --release -p ps2kit
      - run: cargo doc --no-deps -p ps2kit
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --release -p psxbootinspect -p ps2kit
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" README.md LICENSE dist/
          # The research command-line tools from ps2kit, next to the app.
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for t in ps2history pupinfo ps3card nvminfo discprobe ps1card hookmap romdiff bench song; do
            [ -f "target/release/$t$ext" ] && cp "target/release/$t$ext" dist/
          done
          # macOS: the app as a bundle too.
          if [ "${{ runner.os }}" = "macOS" ]; then scripts/macos_bundle.sh dist; fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../psxbootinspect-${{ matrix.name }}.zip" .
          else
            tar czf "../psxbootinspect-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: psxbootinspect-${{ matrix.name }}
          path: psxbootinspect-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Release notes are written by hand in docs/releases/<tag>.md; the generated list of
      # commits is appended after them.
      - uses: softprops/action-gh-release@v2
        with:
          name: PSX Boot Inspection Tool ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: artifacts/*
          generate_release_notes: true
