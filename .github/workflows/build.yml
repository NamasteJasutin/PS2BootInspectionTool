name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: ps2bootinspect.exe
          - os: ubuntu-latest
            name: linux-x64
            bin: ps2bootinspect
          - os: macos-latest
            name: macos-arm64
            bin: ps2bootinspect
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo build --release -p ps2bootinspect -p ps2kit
      - run: cargo test --release -p ps2kit
      - uses: actions/upload-artifact@v4
        with:
          name: ps2bootinspect-${{ matrix.name }}
          path: |
            target/release/${{ matrix.bin }}
            target/release/ps2history${{ runner.os == 'Windows' && '.exe' || '' }}
