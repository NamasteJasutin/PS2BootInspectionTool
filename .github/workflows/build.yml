name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: ps2bootinspect.exe
            history: ps2history.exe
          - os: ubuntu-latest
            name: linux-x64
            bin: ps2bootinspect
            history: ps2history
          - os: macos-latest
            name: macos-arm64
            bin: ps2bootinspect
            history: ps2history
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      # The crate's tests use synthetic inputs only; the oracle tests skip without a BIOS.
      - run: cargo test --release -p ps2kit
      - run: cargo doc --no-deps -p ps2kit
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --release -p ps2bootinspect -p ps2kit
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "target/release/${{ matrix.history }}" README.md LICENSE dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../ps2bootinspect-${{ matrix.name }}.zip" .
          else
            tar czf "../ps2bootinspect-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ps2bootinspect-${{ matrix.name }}
          path: ps2bootinspect-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
