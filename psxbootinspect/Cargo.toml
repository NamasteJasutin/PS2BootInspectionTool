[package]
name = "psxbootinspect"
description = "PSX Boot Inspection Tool: replays PlayStation and PlayStation 2 start-ups from your own BIOS, memory cards and discs, inspects every hand-over, and makes music with the BIOS's own instruments"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["playstation", "ps2", "pcsx2", "bios", "wgpu"]
categories = ["emulators", "games", "visualization"]
publish = false
default-run = "psxbootinspect"

[dependencies]
ps2kit = { version = "0.3.0", path = "../ps2kit" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
cpal = "0.18"
rustfft = "6"
rfd = "0.17"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
