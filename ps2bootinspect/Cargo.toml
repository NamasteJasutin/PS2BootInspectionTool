[package]
name = "ps2bootinspect"
description = "PS2 Boot Inspection Tool: replays the PlayStation 2 start-up from your own BIOS, memory card and disc, with a free camera, time control and a readout of every step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["playstation", "ps2", "pcsx2", "bios", "wgpu"]
categories = ["emulators", "games", "visualization"]
publish = false

[dependencies]
ps2kit = { version = "0.3.0", path = "../ps2kit" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
cpal = "0.18"
rustfft = "6"
rfd = "0.17"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
