[package]
name = "ps2kit"
description = "Readers for PlayStation 2 BIOS dumps, PCSX2 memory cards and disc images, and a re-implementation of the console's boot screen — no Sony data included"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["playstation", "ps2", "pcsx2", "memory-card", "bios"]
categories = ["parser-implementations", "emulators", "games"]
include = ["src/**", "tests/synthetic.rs", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
glam = "0.29"
thiserror = "2"

[[bin]]
name = "ps2history"
path = "src/bin/ps2history.rs"

[[bin]]
name = "pupinfo"
path = "src/bin/pupinfo.rs"

[[bin]]
name = "nvminfo"
path = "src/bin/nvminfo.rs"

[[bin]]
name = "discprobe"
path = "src/bin/discprobe.rs"

[[bin]]
name = "ps1card"
path = "src/bin/ps1card.rs"

[[bin]]
name = "hookmap"
path = "src/bin/hookmap.rs"

[[bin]]
name = "romdiff"
path = "src/bin/romdiff.rs"

[dev-dependencies]
png = "0.17"
