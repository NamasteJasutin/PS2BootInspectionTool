[package]
name = "ps2bootinspect"
description = "PS2 Boot Inspection Tool (cross-platform)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ps2kit = { path = "../ps2kit" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
cpal = "0.18"
rustfft = "6"
rfd = "0.17"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
